<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>테스트</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="app/apple-touch-icon.png"><link rel="icon" href="app/icon-192.png"><meta name="theme-color" content="#2A2273"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="다퍼주는 운세">
<style>body{margin:0;padding:32px 16px;font:16px/1.6 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
a,button{display:block;box-sizing:border-box;width:100%;max-width:360px;margin:0 auto 12px;padding:16px;border:1px solid #d0d5db;border-radius:12px;background:none;font:inherit;text-decoration:none;color:inherit;text-align:center;cursor:pointer}
button{border-color:#2a2273;background:#2a2273;color:#fff}
[hidden]{display:none}
p{max-width:360px;margin:0 auto;word-break:keep-all}
@media (prefers-color-scheme:dark){body{background:#101214;color:#eceef0}a{border-color:#2c3137}}</style></head>
<body><a href="app/">앱 테스트판</a><a href="qa/">QA 체크리스트</a>
<button type="button" id="install">바탕화면 바로가기 만들기</button>
<p id="guide" role="status"></p>
<script>
(function () {
  var prompt = null;
  var button = document.getElementById('install');
  var guide = document.getElementById('guide');
  var ua = navigator.userAgent;
  var standalone = (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
  if (standalone) button.hidden = true;
  function howTo() {
    if (/KAKAOTALK|NAVER|Instagram|FBAN|FBAV/i.test(ua)) return '지금 앱 안의 브라우저로 열려 있어요. 오른쪽 메뉴에서 「다른 브라우저로 열기」를 고른 뒤 이 버튼을 다시 눌러 주세요.';
    if (/iPad|iPhone|iPod/.test(ua)) return 'Safari 아래쪽 공유 버튼을 누른 뒤 「홈 화면에 추가」를 골라 주세요.';
    if (/Android/.test(ua)) return '브라우저 오른쪽 위 메뉴(⋮)에서 「앱 설치」나 「홈 화면에 추가」를 골라 주세요. 이미 만들었다면 그 아이콘으로 여시면 돼요.';
    return '크롬이나 엣지 주소창 오른쪽의 설치 아이콘을 눌러 주세요. 이미 만들었다면 그 아이콘으로 여시면 돼요.';
  }
  window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); prompt = e; });
  window.addEventListener('appinstalled', function () { prompt = null; guide.textContent = '바로가기를 만들었어요.'; });
  button.addEventListener('click', function () {
    if (!prompt) { guide.textContent = howTo(); return; }
    var p = prompt;
    prompt = null;
    p.prompt();
  });
})();
</script></body>
</html>
